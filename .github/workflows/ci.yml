name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sampai
      uses: actions/checkout@v4
      with:
        path: sampai

    - name: Checkout samurai C++ (sibling directory for headers)
      uses: actions/checkout@v4
      with:
        repository: hpc-maths/samurai
        path: samurai
        ref: main

    - name: Install Miniforge
      run: |
        wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
        bash Miniforge3-Linux-x86_64.sh -b -p $HOME/miniforge3

    - name: Create conda environment with all dependencies
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        conda create -n sampai-ci -c conda-forge \
          python=3.12 \
          samurai \
          xtensor \
          xtensor-blas \
          hdf5 \
          highfive \
          pugixml \
          fmt \
          cli11 \
          cmake \
          ninja \
          numpy \
          pytest \
          pytest-cov \
          h5py \
          pybind11 \
          scikit-build-core

    - name: Build sampai (LOCAL mode for headers, conda for libs)
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-ci

        cd sampai
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release \
          -DSAMURAI_PYTHON_STANDALONE=ON \
          -DSAMURAI_SOURCE=LOCAL \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/samurai;$HOME/miniforge3/envs/sampai-ci" \
          -GNinja
        cmake --build . --parallel 2

    - name: Run tests
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-ci

        cd sampai
        pip install -e .
        pytest tests/ -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-ubuntu-py312
        path: |
          sampai/build/Testing/
          sampai/.pytest_cache/
