name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sampai
      uses: actions/checkout@v4
      with:
        path: sampai

    - name: Checkout samurai C++ (sibling directory)
      uses: actions/checkout@v4
      with:
        repository: hpc-maths/samurai
        path: samurai
        ref: main

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          g++ \
          libhdf5-dev \
          libxtensor-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest pytest-cov h5py pybind11 scikit-build-core

    - name: Build samurai C++ (from source)
      run: |
        cd samurai
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -GNinja \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/samurai-install
        cmake --build . --parallel 2
        cmake --install . || echo "Install step had issues but continuing..."

    - name: Build sampai (LOCAL mode - use samurai from source)
      run: |
        cd sampai
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release \
          -DSAMURAI_PYTHON_STANDALONE=ON \
          -DSAMURAI_SOURCE=LOCAL \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/samurai-install;${{ github.workspace }}/samurai" \
          -GNinja
        cmake --build . --parallel 2

    - name: Install sampai
      run: |
        cd sampai/build
        cmake --install . || pip install -e ../

    - name: Run tests
      run: |
        cd sampai
        pip install -e .
        pytest tests/ -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-ubuntu-py312
        path: |
          sampai/build/Testing/
          sampai/.pytest_cache/
