name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout sampai
      uses: actions/checkout@v4
      with:
        path: sampai

    - name: Install Miniforge
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "macOS" ]; then
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-arm64.sh
          bash Miniforge3-MacOSX-arm64.sh -b -p $HOME/miniforge3
        else
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash Miniforge3-Linux-x86_64.sh -b -p $HOME/miniforge3
        fi

    - name: Create conda environment with all dependencies
      shell: bash
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        conda create -n sampai-ci -c conda-forge \
          python=3.12 \
          xtensor \
          xtensor-blas \
          hdf5 \
          highfive \
          pugixml \
          fmt \
          cli11 \
          meson-python \
          meson \
          ninja \
          numpy \
          pytest \
          pytest-cov \
          h5py \
          matplotlib \
          pybind11

    - name: Build sampai with Meson
      shell: bash
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-ci

        cd sampai
        meson setup builddir
        meson compile -C builddir

    - name: Run tests
      shell: bash
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-ci

        cd sampai
        pip install --no-build-isolation --no-deps -e .
        pytest tests/ -v --tb=short -m "not requires_cpp_references"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-py312
        path: |
          sampai/builddir/meson-logs/testlog.txt
          sampai/.pytest_cache/

  build-and-test-mpi:
    # Test MPI support on Ubuntu only
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sampai
      uses: actions/checkout@v4
      with:
        path: sampai

    - name: Install Miniforge
      run: |
        wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
        bash Miniforge3-Linux-x86_64.sh -b -p $HOME/miniforge3

    - name: Create conda environment with MPI dependencies
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        conda create -n sampai-mpi -c conda-forge \
          python=3.12 \
          xtensor \
          xtensor-blas \
          "hdf5=1.14.6=mpi_mpich*" \
          highfive \
          pugixml \
          fmt \
          cli11 \
          meson-python \
          meson \
          ninja \
          numpy \
          pytest \
          h5py \
          matplotlib \
          pybind11 \
          mpich \
          mpi4py \
          boost \
          libfabric \
          libboost-mpi \
          libboost-devel \
          libboost-headers

    - name: Build sampai with MPI
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-mpi

        # Set PKG_CONFIG_PATH to find MPI via pkg-config
        export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
        export MPICC="$CONDA_PREFIX/bin/mpicc"
        export MPICXX="$CONDA_PREFIX/bin/mpicxx"
        # Ensure libfabric has an unversioned symlink for the linker
        if [ ! -e "$CONDA_PREFIX/lib/libfabric.so" ]; then
          libfabric_target="$(ls "$CONDA_PREFIX"/lib/libfabric.so.* 2>/dev/null | head -n 1)"
          if [ -n "$libfabric_target" ]; then
            ln -s "$libfabric_target" "$CONDA_PREFIX/lib/libfabric.so"
          fi
        fi

        cd sampai
        meson setup builddir -Dmpi=true
        meson compile -C builddir

    - name: Install sampai Python package (MPI)
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-mpi

        cd sampai
        pip install --no-build-isolation --no-deps -e . -Csetup-args=-Dmpi=true

    - name: Run MPI tests
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-mpi

        cd sampai
        # Run basic MPI test with 1 rank (verifies MPI compilation)
        mpiexec -n 1 python -c "
        from mpi4py import MPI
        from sampai import mpi
        import sampai as sam

        print(f'Rank {mpi.rank()}/{mpi.size()}: MPI test started')

        # Test mesh creation (auto-distributed)
        box = sam.geometry.box([0.0, 0.0], [1.0, 1.0])
        config = sam.config.make(2)
        config.min_level = 2
        config.max_level = 3
        mesh = sam.mesh.make(box, config)

        print(f'Rank {mpi.rank()}: {mesh.nb_cells} cells')

        # Test field and ghost update
        u = sam.field.zeros(mesh, 'u')
        sam.adaptation.update_ghost_mr(u)

        # Test save
        sam.save('test_mpi.h5', u)

        mpi.barrier()
        if mpi.rank() == 0:
            print('MPI test PASSED')
        "

        # Clean up test file
        rm -f test_mpi*.h5 test_mpi*.xdmf

    - name: Upload MPI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-mpi-ubuntu-py312
        path: |
          sampai/builddir/meson-logs/testlog.txt
          sampai/.pytest_cache/

  validation-vs-cpp:
    # Validate Python outputs against C++ reference files (Linux only)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sampai
      uses: actions/checkout@v4
      with:
        path: sampai

    - name: Install Miniforge
      run: |
        wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
        bash Miniforge3-Linux-x86_64.sh -b -p $HOME/miniforge3

    - name: Create conda environment
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        conda create -n sampai-validation -c conda-forge \
          python=3.12 \
          cmake \
          ninja \
          xtensor \
          xtensor-blas \
          hdf5 \
          highfive \
          pugixml \
          fmt \
          cli11 \
          meson-python \
          meson \
          numpy \
          pytest \
          h5py \
          matplotlib \
          pybind11

    - name: Download Samurai source (needed for C++ demos)
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-validation

        cd sampai
        # Download samurai if not already present (via samurai-headers subproject)
        if [ ! -d "subprojects/samurai-headers/samurai/include/samurai" ]; then
            echo "Downloading Samurai from GitHub..."
            git clone --depth=1 --single-branch https://github.com/hpc-maths/samurai.git subprojects/samurai-headers/samurai
            echo "Samurai downloaded successfully!"
        else
            echo "Samurai already present, skipping download"
        fi

    - name: Build Samurai C++ demos (advection only)
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-validation

        # Configure CMake for samurai - disable MPI, PETSc to save memory
        cd sampai/subprojects/samurai-headers/samurai
        mkdir -p build
        cd build

        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_DEMOS=ON \
          -DWITH_MPI=OFF \
          -DWITH_PETSC=OFF \
          -DWITH_OPENMP=OFF

        # Build only the advection targets
        cmake --build . --target finite-volume-advection-1d finite-volume-advection-2d -j4

    - name: Build sampai Python (uses existing samurai)
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-validation

        cd sampai
        meson setup builddir
        meson compile -C builddir

    - name: Generate C++ reference files
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-validation

        cd sampai
        mkdir -p test_output

        # Run C++ advection_1d demo
        ./subprojects/samurai-headers/samurai/build/demos/FiniteVolume/finite-volume-advection-1d \
          --path test_output \
          --filename cpp_advection_1d \
          --Tf 0.1

        # Run C++ advection_2d demo
        ./subprojects/samurai-headers/samurai/build/demos/FiniteVolume/finite-volume-advection-2d \
          --path test_output \
          --filename cpp_advection_2d \
          --Tf 0.01

    - name: Install sampai Python package
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-validation

        cd sampai
        pip install --no-build-isolation --no-deps -e .

    - name: Run Python validation demos
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-validation

        cd sampai
        mkdir -p test_output

        # Run Python advection_1d
        python -c 'from tests.validation_demos import advection_1d; advection_1d.run_advection_1d(Tf=0.1, output_path="test_output", filename="py_advection_1d")'

        # Run Python advection_2d
        python -c 'from tests.validation_demos import advection_2d; advection_2d.run_advection_2d(Tf=0.01, output_path="test_output", filename="py_advection_2d")'

    - name: Compare C++ vs Python outputs
      run: |
        export PATH="$HOME/miniforge3/bin:$PATH"
        source $HOME/miniforge3/etc/profile.d/conda.sh
        conda activate sampai-validation

        cd sampai
        python scripts/ci_validation_compare.py

    - name: Upload validation results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-results-ubuntu-py312
        path: |
          sampai/test_output/
          sampai/.pytest_cache/
